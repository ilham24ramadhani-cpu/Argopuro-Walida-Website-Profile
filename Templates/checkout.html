{% extends 'base.html' %}
{% set wa_message_key = 'wa.checkout' %}

{% block title_key %}title.checkout{% endblock %}
{% block content %}
<div class="wrap booking-wrap" id="checkout-root" data-id="{{ id_polygon }}" data-payment="{{ pembayaran }}">
  <p class="status-box" data-i18n="common.loading">Memuat…</p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('script_files', filename='booking.js') }}"></script>
<script src="{{ url_for('script_files', filename='checkout.js') }}"></script>
{% endblock %}
