{% extends 'base.html' %}
{% set wa_message_key = 'wa.invoice' %}
{% block title %}Invoice {{ id_pembelian }} — {{ company.nama }}{% endblock %}
{% block title_key %}title.invoice{% endblock %}
{% block content %}
<div class="wrap invoice-page" id="invoice-root" data-id="{{ id_pembelian }}">
  <p class="lede" data-i18n="invoice.loading">Memuat invoice…</p>
</div>
{% endblock %}
{% block scripts %}
<script>
  window.APP = {
    logoUrl: {{ url_for('static', filename='logo.png')|tojson }},
    letterhead: {{ letterhead|tojson }},
    paymentDefault: {{ pembayaran_default|tojson }},
  };
</script>
<script src="{{ url_for('script_files', filename='invoice.js') }}"></script>
{% endblock %}
